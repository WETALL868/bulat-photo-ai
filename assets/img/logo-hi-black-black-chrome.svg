<svg xmlns="http://www.w3.org/2000/svg" width="743" height="274" viewBox="332 75 743 274" role="img" aria-label="Hi-Black">
  <!-- Black Chrome. Компактный веб-вариант утверждённого макета: убраны
       демонстрационный холст, подпись и пустые поля, подложка подтянута к
       надписи, viewBox обрезан по логотипу. Координаты HIBL (x=431), точечной A
       (736…824) и CK (x=867) взяты из макета без изменений, поэтому расстояния
       между тремя частями остались ровно такими, как были выверены.
       Буквы заданы контурами, а не text+font-family: шрифта Impact на
       устройстве пользователя может не быть, и подстановка другого шрифта
       разъехала бы именно эти расстояния. -->
  <defs>
    <linearGradient id="hbbc-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e4249"/>
      <stop offset="0.18" stop-color="#121417"/>
      <stop offset="0.52" stop-color="#26292e"/>
      <stop offset="0.78" stop-color="#090a0c"/>
      <stop offset="1" stop-color="#34373d"/>
    </linearGradient>
    <linearGradient id="hbbc-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#858a93"/>
      <stop offset="0.15" stop-color="#24272c"/>
      <stop offset="0.48" stop-color="#020304"/>
      <stop offset="0.72" stop-color="#3a3e45"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="hbbc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff39a"/>
      <stop offset="0.24" stop-color="#ffdf38"/>
      <stop offset="0.57" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#a86d00"/>
    </linearGradient>
    <linearGradient id="hbbc-goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#af7300"/>
      <stop offset="0.25" stop-color="#fff087"/>
      <stop offset="0.58" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#8d5b00"/>
    </linearGradient>
    <pattern id="hbbc-satin" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <rect width="38" height="38" fill="transparent"/>
      <rect width="13" height="38" fill="#fff" opacity="0.018"/>
      <rect x="19" width="5" height="38" fill="#000" opacity="0.08"/>
    </pattern>
    <filter id="hbbc-plateshadow" x="-14%" y="-22%" width="132%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="hbbc-typeshadow" x="-20%" y="-34%" width="150%" height="190%">
      <feDropShadow dx="9" dy="13" stdDeviation="4" flood-color="#000" flood-opacity="0.95"/>
    </filter>
    <!-- HIBL и CK: высота прописных 111, базовая линия 268 — как в макете. -->
    <g id="hbbc-type">
      <path transform="translate(431 157)" d="M0 0H26V44.5H57V0H83V111H57V66.5H26V111H0Z"/>
      <path transform="translate(519 157)" d="M0 0H28V111H0Z"/>
      <path transform="translate(552 157)" fill-rule="evenodd" d="M0 0H52C69 0 78 9 78 27C78 39 73 47 65 52C75 56 79 65 79 80C79 99 68 111 49 111H0ZM26 20H46C52 20 55 24 55 32C55 40 52 44 46 44H26ZM26 67H48C54 67 57 71 57 79C57 87 54 91 48 91H26Z"/>
      <path transform="translate(631 157)" d="M0 0H26V89H78V111H0Z"/>
      <path transform="translate(867 157)" d="M40 0C15 0 0 21 0 55.5C0 90 15 111 40 111C62 111 76 99 79 78H52C50 86 46 89 40 89C31 89 27 77 27 55.5C27 34 31 22 40 22C46 22 50 25 52 33H79C76 12 62 0 40 0Z"/>
      <path transform="translate(946 157)" d="M0 0H26V49L56 0H82L50 51L84 111H55L33 70L26 80V111H0Z"/>
    </g>
    <g id="hbbc-dots">
      <circle cx="790" cy="137" r="20"/>
      <circle cx="763" cy="181" r="20"/><circle cx="807" cy="181" r="20"/>
      <circle cx="736" cy="225" r="20"/><circle cx="780" cy="225" r="20"/><circle cx="824" cy="225" r="20"/>
    </g>
  </defs>

  <g filter="url(#hbbc-plateshadow)">
    <path d="M383 109 L1053 97 L1024 309 L354 321 Z" fill="#030405" stroke="#000" stroke-width="10"/>
    <path d="M378 104 L1048 92 L1019 304 L349 316 Z" fill="url(#hbbc-plate)" stroke="#565a62" stroke-width="3"/>
    <path d="M378 104 L1048 92 L1019 304 L349 316 Z" fill="url(#hbbc-satin)"/>
    <path d="M391 117 L1033 106" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M356 303 L1019 291" stroke="url(#hbbc-goldline)" stroke-width="10"/>
    <path d="M359 296 L1021 284" stroke="#ffe15a" stroke-opacity="0.32" stroke-width="2"/>
  </g>

  <!-- Три части собраны в одно слово; наклон и объём — из макета. -->
  <g transform="skewX(-10)" filter="url(#hbbc-typeshadow)">
    <use href="#hbbc-type" transform="translate(10 15)" fill="#020203" stroke="#855700" stroke-width="10"/>
    <use href="#hbbc-type" fill="url(#hbbc-chrome)" stroke="#ffd128" stroke-width="4"/>
    <use href="#hbbc-dots" transform="translate(8 12)" fill="#835600" stroke="#030303" stroke-width="4"/>
    <use href="#hbbc-dots" fill="url(#hbbc-gold)" stroke="#fff2a4" stroke-width="1.5"/>
    <path d="M774 124 Q790 112 807 124" fill="none" stroke="#fff" stroke-opacity="0.48" stroke-width="4" stroke-linecap="round"/>
    <path d="M442 152 L671 148 M876 147 L1022 145" stroke="#fff" stroke-opacity="0.2" stroke-width="3"/>
  </g>
</svg>
